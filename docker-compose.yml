services:
  whatsapp-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_DIR: /data/auth
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  whatsapp_auth:
